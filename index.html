<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>InternMatch Recruiter</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #172033; --ink2: #4A5568; --ink3: #7B8698; --line: #E2E6ED; --line2: #EDF0F4;
  --navy: #111A2E; --navy2: #1A2540; --accent: #3355E0; --accent-d: #2643C4; --accent-s: #E9EDFC;
  --hi: #0F8A6A; --mid: #C08A12; --lo: #C0492F; --na: #D5DAE3;
  --font: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 8px; --side: 232px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 14px/1.5 var(--font); color: var(--ink); background: var(--bg); font-variant-numeric: tabular-nums; }
body.lock { overflow: hidden; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 620; }
h4 { font-size: 13px; font-weight: 620; margin: 20px 0 8px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
small { font-size: 12px; } .sm { font-size: 12px; } .muted { color: var(--ink3); } .warn { color: var(--lo); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.ic { flex: none; vertical-align: -3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--line2); padding: 1px 5px; border-radius: 4px; }

/* shell */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--navy); color: #C9D1E3; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 16px 12px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 18px; color: #fff; }
.brand b { display: block; font-size: 15px; } .brand small { color: #8E9AB8; }
.logo { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 13px; letter-spacing: 0.02em; flex: none; }
.logo.lg { width: 44px; height: 44px; font-size: 16px; border-radius: 10px; }
.side nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.side nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; color: #C9D1E3; font-weight: 500; }
.side nav a:hover { background: var(--navy2); text-decoration: none; color: #fff; }
.side nav a.on { background: var(--navy2); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.side-foot { display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid #263252; }
.side-foot > div { flex: 1; min-width: 0; } .side-foot b { display: block; color: #fff; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .side-foot small { color: #8E9AB8; }
.side .ib { color: #9AA6C4; } .side .ib:hover { color: #fff; background: var(--navy2); }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 28px; background: rgba(243, 245, 248, 0.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.ib.menu { display: none; }
.gs { position: relative; flex: 1; max-width: 560px; }
.gs-i { position: absolute; left: 11px; top: 9px; color: var(--ink3); }
.gs input { width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.gs input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-s); }
.sres { position: absolute; top: 42px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 32px rgba(17, 26, 46, 0.14); max-height: 60vh; overflow: auto; z-index: 30; padding: 4px; }
.sr-i { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; text-align: left; border-radius: 6px; cursor: pointer; color: var(--ink); }
.sr-i:hover { background: var(--bg); text-decoration: none; } .sr-i span { min-width: 0; } .sr-i b { display: block; font-size: 13px; } .sr-i small { color: var(--ink3); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-e { padding: 12px; color: var(--ink3); }
.content { padding: 24px 28px 96px; max-width: 1480px; width: 100%; }
.scrim-nav { display: none; }

/* headers, panels */
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.ph h1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .ph p { margin-top: 4px; max-width: 70ch; }
.ph-a { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumb { color: var(--ink3); font-size: 13px; margin-bottom: 8px; } .crumb span { color: var(--ink2); }
.panel { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
.pt { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.pad { padding: 14px 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; } .col { min-width: 0; }
.row-c { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; } .row-c.l { justify-content: flex-start; }
.empty { text-align: center; padding: 40px 16px; color: var(--ink2); } .empty h2 { margin-bottom: 6px; color: var(--ink); } .empty p { margin-bottom: 14px; }
.empty-s { color: var(--ink3); text-align: center; padding: 8px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.tile span { color: var(--ink2); font-size: 13px; } .tile b { font-size: 28px; line-height: 1.1; font-weight: 650; letter-spacing: -0.02em; }
.tile.key { background: var(--navy); border-color: var(--navy); } .tile.key span { color: #A9B4CF; } .tile.key b { color: #fff; }

/* tables */
.tw { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink3); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.tbl tbody tr:hover { background: #FAFBFD; } .tbl tr.sel { background: var(--accent-s); }
.tbl.compact td { padding: 8px 10px; } .tbl tr:last-child td { border-bottom: 0; }
.tbl .ck { width: 34px; padding-right: 0; } .tbl .rk { font-weight: 650; color: var(--ink2); width: 44px; }
.tbl .num { text-align: right; } .tbl th:has(+ th) { } .nw { white-space: nowrap; }
.tbl td.act { white-space: nowrap; text-align: right; } .tbl td.act .btn + .btn { margin-left: 4px; }
.tbl td.sk { min-width: 120px; }
.ib-d:hover:not(:disabled) { color: var(--lo); background: #FBE5E1; }
.sub { display: block; color: var(--ink3); font-size: 12px; } .sub-t { color: var(--ink2); font-size: 12px; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.cn { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--ink); }
.cn b { display: block; font-weight: 600; white-space: nowrap; } .cn:hover b { color: var(--accent); } .cn small { color: var(--ink3); display: block; }
.av { --h: 212; width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 650; flex: none; background: hsl(var(--h) 55% 92%); color: hsl(var(--h) 55% 28%); }
.av.lg { width: 48px; height: 48px; font-size: 16px; }

/* badges, chips */
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-gray { background: #EEF1F5; color: #4A5568; } .b-blue { background: #E3EDFF; color: #1F4FBF; } .b-indigo { background: #E8E9FF; color: #3E3FBF; }
.b-violet { background: #F0E6FF; color: #6B34C4; } .b-green { background: #DDF4EA; color: #0E7A55; } .b-red { background: #FBE5E1; color: #B23A26; } .b-amber { background: #FCEFD0; color: #8A5A00; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 6px; background: var(--line2); color: var(--ink2); font-size: 12px; margin: 0 4px 4px 0; }
.chip.sm { padding: 1px 7px; font-size: 11.5px; } .chip.req { background: var(--accent-s); color: var(--accent-d); font-weight: 600; } .chip.hit { background: #DDF4EA; color: #0E7A55; font-weight: 600; }
.more { color: var(--ink3); font-size: 12px; } .chips { display: flex; flex-wrap: wrap; }
.role-chip, .top .chip { background: var(--surface); border: 1px solid var(--line); margin: 0; }

/* the match signature */
.mc { display: inline-flex; align-items: flex-end; gap: 8px; }
.mn { font-size: 15px; font-weight: 700; min-width: 34px; }
.spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 22px; width: 34px; }
.spark i { flex: 1; border-radius: 1px; min-height: 2px; }
.s-hi { background: var(--hi); } .s-mid { background: var(--mid); } .s-lo { background: var(--lo); } .s-na { background: var(--na); }
.t-hi { color: var(--hi); } .t-mid { color: var(--mid); } .t-lo { color: var(--lo); } .t-na { color: var(--ink3); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-weight: 550; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--bg); text-decoration: none; } .btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-s { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; } .btn-primary:hover:not(:disabled) { background: var(--accent-d); }
.btn-danger { background: var(--lo); border-color: var(--lo); color: #fff; } .btn-danger:hover:not(:disabled) { background: #A33C25; }
.btn-ghost-d { color: var(--lo); } .btn-ghost { border-color: transparent; background: transparent; color: var(--ink2); }
.ib { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--ink2); } .ib:hover:not(:disabled) { background: var(--line2); } .ib:disabled { opacity: 0.35; cursor: not-allowed; }
.linkb { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }

/* filters and forms */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
.fl { display: flex; flex-direction: column; gap: 4px; min-width: 130px; font-size: 12px; color: var(--ink2); } .fl.grow { flex: 1; min-width: 220px; } .fl.nm { min-width: 90px; max-width: 110px; } .fl.inline { flex-direction: row; align-items: center; gap: 8px; }
.fl input, .fl select, .fl textarea, .srt select, .addr input, textarea#noteText, textarea#fbText, .acct-s { height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); width: 100%; }
.fl textarea, textarea#noteText, textarea#fbText { height: auto; padding: 8px 10px; resize: vertical; }
.fl input:focus, .fl select:focus, .fl textarea:focus, textarea:focus, .addr input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-s); }
.srt { display: flex; gap: 4px; align-items: center; } .srt select { width: auto; }
.bd { border: 1px solid var(--line); background: var(--surface); }
.qsel { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; font-size: 13px; }
.qsel input { width: 64px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; }
.form .fg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .form .fl.w2 { grid-column: 1 / -1; }
.assign { border: 1px solid var(--line); border-radius: var(--r); margin: 14px 0 0; padding: 10px 12px; } .assign legend { padding: 0 6px; font-size: 12px; color: var(--ink2); }
.ck-l { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.addr { display: flex; gap: 8px; margin-top: 12px; } .addr input { max-width: 380px; }

/* bulk bar */
.bulk { position: fixed; left: calc(var(--side) + 50%); transform: translateX(-50%); bottom: 20px; z-index: 40; background: var(--navy); color: #fff; padding: 10px 14px; border-radius: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: 0 12px 32px rgba(17, 26, 46, 0.3); max-width: calc(100vw - 32px); }
.bulk .btn { background: var(--navy2); border-color: #33426B; color: #fff; } .bulk .btn:hover:not(:disabled) { background: #26335A; } .bulk .btn-primary { background: var(--accent); border-color: var(--accent); }
.bulk .btn-danger { background: var(--lo); border-color: var(--lo); } .bulk .btn-ghost { background: transparent; border-color: transparent; color: #A9B4CF; }
.bulk .mv { display: inline-flex; gap: 4px; } .bulk select { height: 28px; border-radius: 6px; border: 1px solid #33426B; background: var(--navy2); color: #fff; padding: 0 6px; max-width: 160px; }

/* dashboard extras */
.tbl a b { color: var(--ink); } .list { list-style: none; margin: 0; padding: 0; } .list li { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line2); } .list li:last-child { border: 0; }
.list .cn { flex: 1.2; min-width: 0; } .li-m { flex: 1; color: var(--ink2); font-size: 12.5px; min-width: 0; } .li-a { display: flex; gap: 4px; }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin-bottom: 12px; } .stack i { display: block; min-width: 4px; }
.stack .b-blue, .legend .b-blue { background: #6E93F2; } .stack .b-indigo, .legend .b-indigo { background: #5B5BD6; } .stack .b-violet, .legend .b-violet { background: #9061E0; }
.stack .b-amber, .legend .b-amber { background: #E0A928; } .stack .b-green, .legend .b-green { background: #2FA77E; } .stack .b-red, .legend .b-red { background: #D9614A; } .stack .b-gray, .legend .b-gray { background: #B9C1CF; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; } .legend li { display: flex; align-items: center; gap: 8px; font-size: 13px; } .legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; } .legend small { color: var(--ink3); margin-left: auto; }
.line { width: 100%; height: auto; display: block; } .line .gl { stroke: var(--line); stroke-width: 1; } .line .gt { fill: var(--ink3); font-size: 10px; } .line .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; } .line .ar { fill: var(--accent); opacity: 0.08; }
.hbars { display: flex; flex-direction: column; gap: 8px; } .hb { display: grid; grid-template-columns: minmax(90px, 34%) 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.hb-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink2); } .hb-t { height: 10px; background: var(--line2); border-radius: 5px; overflow: hidden; } .hb-t i { display: block; height: 100%; background: var(--accent); border-radius: 5px; } .hb-v { text-align: right; }
.funnel { display: flex; flex-direction: column; gap: 8px; } .fn { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 12px; align-items: center; }
.fn-bar { height: 34px; background: var(--navy); border-radius: 6px; color: #fff; display: flex; align-items: center; padding: 0 12px; font-weight: 650; min-width: 44px; } .fn:nth-child(2) .fn-bar { background: #26365F; } .fn:nth-child(3) .fn-bar { background: #2F4A9A; } .fn:nth-child(4) .fn-bar { background: #3355E0; } .fn:nth-child(5) .fn-bar { background: var(--hi); }
.fn-l { font-size: 13px; } .fn-l small { display: block; color: var(--ink3); }

/* job page */
.job-ov { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(220px, 1fr); gap: 24px; } .job-ov p { color: var(--ink2); max-width: 70ch; margin-bottom: 12px; }
.skl { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 6px; } .skl > span { width: 70px; flex: none; color: var(--ink3); font-size: 12px; }
details { margin-top: 8px; } summary { cursor: pointer; color: var(--accent); font-weight: 550; } details p { margin-top: 4px; }
.facts { margin: 0; display: grid; gap: 10px; align-content: start; } .facts div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line2); padding-bottom: 8px; } .facts dt { color: var(--ink3); } .facts dd { margin: 0; font-weight: 600; text-align: right; }
.pipe { list-style: none; margin: 0; padding: 0; display: flex; gap: 0; overflow-x: auto; } .pipe li { flex: 1; min-width: 96px; padding: 10px 14px; border: 1px solid var(--line); margin-left: -1px; background: var(--surface); }
.pipe li:first-child { border-radius: 8px 0 0 8px; margin-left: 0; } .pipe li:last-child { border-radius: 0 8px 8px 0; background: #F0FAF6; }
.pipe b { display: block; font-size: 22px; line-height: 1.2; } .pipe span { font-size: 12px; color: var(--ink2); } .pipe-n { margin-top: 8px; font-size: 12.5px; }

/* rounds */
.rcards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; } .rcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.rc-h { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; } .rc-n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-s); color: var(--accent-d); display: grid; place-items: center; font-weight: 650; font-size: 12px; flex: none; }
.rn { flex: 1; min-width: 120px; height: 32px; border: 1px solid transparent; border-radius: 6px; padding: 0 8px; font-weight: 600; background: transparent; } .rn:hover:not(:disabled), .rn:focus { border-color: var(--line); background: #fff; outline: none; }
.rc-c { color: var(--ink3); font-size: 12px; white-space: nowrap; } .rc-b { display: grid; grid-template-columns: 170px 1fr; gap: 12px; margin-top: 8px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 12px; cursor: pointer; color: var(--ink2); font-weight: 550; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; } .tab:hover { color: var(--ink); } .tab.on { color: var(--accent-d); border-bottom-color: var(--accent); }
.cnt { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--line2); font-size: 11.5px; text-align: center; margin-left: 4px; } .tab.on .cnt { background: var(--accent-s); }

/* drawer */
.dscrim { position: fixed; inset: 0; background: rgba(17, 26, 46, 0.4); z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--surface); z-index: 51; display: flex; flex-direction: column; box-shadow: -16px 0 40px rgba(17, 26, 46, 0.18); }
.d-h { padding: 18px 22px 0; border-bottom: 1px solid var(--line); } .d-h .tabs { margin: 12px 0 0; border: 0; }
.d-t { display: flex; gap: 14px; align-items: flex-start; } .d-n { flex: 1; min-width: 0; } .d-n h2 { font-size: 18px; } .d-n p { font-size: 13px; color: var(--ink2); }
.d-r { display: flex; align-items: center; gap: 8px; } .d-m { text-align: center; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; } .d-m b { display: block; font-size: 20px; line-height: 1.1; } .d-m small { color: var(--ink3); }
.d-s { margin-top: 10px; } .d-a { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.d-b { flex: 1; overflow-y: auto; padding: 4px 22px 40px; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 20px; margin: 16px 0 0; } .kv div { border-bottom: 1px solid var(--line2); padding-bottom: 6px; } .kv dt { font-size: 12px; color: var(--ink3); } .kv dd { margin: 0; font-weight: 550; overflow-wrap: anywhere; }
.item { padding: 8px 0; border-bottom: 1px solid var(--line2); } .item p { color: var(--ink2); margin: 2px 0 6px; }

/* ---- text ---- */
/* InternMatch · shared text utilities (skill vocabulary, tokenizer, TF-IDF).
   Used by every AI service. Pure functions, no DOM, no network. */
(function (g) {
  'use strict';

  const STOP = new Set(('a an the and or of to in for on with at by from as is are was were be been being this that ' +
    'these those it its into over per using use used via etc our your their his her we you they i will can should ' +
    'may must such than then also more most other any all each both not no nor but if while during within across ' +
    'about have has had do does did so up out new').split(' '));

  // "Canonical|alias|alias". Extend this list to teach the parser new skills.
  const RAW = [
    'SQL|mysql|postgresql|postgres|t-sql|sqlite|sql server', 'Python|python3', 'Pandas', 'NumPy',
    'Excel|microsoft excel|ms excel|advanced excel|vlookup|pivot table|pivot tables',
    'Power BI|powerbi|power-bi', 'Tableau', 'Looker|looker studio|data studio', 'Google Analytics|ga4',
    'Data Visualization|data visualisation|data viz|dashboarding|dashboards|dashboard',
    'Statistics|statistical analysis|hypothesis testing|regression analysis|statistical',
    'A/B Testing|a/b test|a/b tests|ab testing|split testing|experimentation',
    'Product Analytics|funnel analysis|retention analysis|cohort analysis|mixpanel|amplitude',
    'Machine Learning|ml|scikit-learn|sklearn|xgboost', 'Deep Learning|tensorflow|keras|pytorch|neural network|neural networks',
    'R|r programming|rstudio|ggplot2', 'ETL|data pipeline|data pipelines|data cleaning',
    'Market Research|market analysis|competitor analysis|customer research|surveys',
    'Presentation|presentations|powerpoint|public speaking',
    'Business Analysis|requirements gathering|business requirements|process mapping|kpi analysis|kpis',
    'CAD|computer-aided design|autocad|creo|catia', 'SolidWorks', 'Fusion 360|fusion360', 'ANSYS|ansys workbench',
    'FEA|finite element|finite element analysis', 'CFD|computational fluid dynamics|openfoam',
    'GD&T|gdt|geometric dimensioning|tolerancing', '3D Printing|additive manufacturing|fdm|3d printer',
    'Manufacturing|machining|cnc|sheet metal|injection moulding|injection molding|dfm|dfma|casting',
    'MATLAB|simulink', 'C++|cpp', 'C|embedded c', 'Embedded Systems|arduino|stm32|microcontroller|microcontrollers|esp32',
    'ROS|ros2|robot operating system', 'Linux|ubuntu|bash', 'Control Systems|pid control|pid controller|control theory|state space',
    'OpenCV', 'Computer Vision|image processing|object detection|yolo', 'Git|github|version control', 'Docker',
    'JavaScript|js|node.js|nodejs', 'React|react.js|reactjs', 'Java', 'Kinematics|robot kinematics',
    'PCB Design|kicad|altium', 'Agile|scrum|kanban|jira', 'Figma'
  ];

  const DOMAINS = {
    'Data & Analytics': ['data analytics', 'data analysis', 'analytics', 'data science', 'business intelligence', 'dashboard'],
    'Product': ['product management', 'product analytics', 'product analyst', 'product'],
    'Business': ['business analysis', 'business analyst', 'consulting', 'strategy', 'finance'],
    'Mechanical Design': ['mechanical design', 'cad', 'product design', 'manufacturing', 'design engineering'],
    'Robotics': ['robotics', 'automation', 'mechatronics', 'autonomous'],
    'Machine Learning': ['machine learning', 'deep learning', 'artificial intelligence', 'computer vision'],
    'Software': ['software', 'web development', 'backend', 'frontend', 'full stack']
  };

  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const CANON = new Map();
  const SCAN = [];
  RAW.forEach(line => {
    const [name, ...aliases] = line.split('|');
    const all = [name, ...aliases];
    all.forEach(a => CANON.set(a.toLowerCase(), name));
    const terms = all.filter(a => a.length > 1);
    if (terms.length) SCAN.push({
      name,
      re: new RegExp('(?<![a-z0-9+#])(?:' + terms.map(a => escRe(a.toLowerCase())).join('|') + ')(?![a-z0-9+#])', 'i')
    });
  });
  const DOMAIN_RE = Object.entries(DOMAINS).map(([name, terms]) => ({
    name, re: new RegExp('(?<![a-z0-9])(?:' + terms.map(t => escRe(t)).join('|') + ')(?![a-z0-9])', 'i')
  }));

  const canon = s => { const t = String(s == null ? '' : s).trim(); return CANON.get(t.toLowerCase()) || t; };
  const key = s => canon(s).toLowerCase();
  const uniq = a => [...new Set(a)];
  const extractSkills = text => { const t = String(text || '').toLowerCase(); return SCAN.filter(x => x.re.test(t)).map(x => x.name); };
  const extractDomains = text => { const t = String(text || ''); return DOMAIN_RE.filter(x => x.re.test(t)).map(x => x.name); };

  function stem(w) {
    if (w.length > 4 && w.endsWith('ies')) return w.slice(0, -3) + 'y';
    if (w.length > 5 && w.endsWith('ing')) return w.slice(0, -3);
    if (w.length > 4 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1);
    return w;
  }
  function tokens(text) {
    return String(text || '').toLowerCase().replace(/[^a-z0-9+#\s]/g, ' ').split(/\s+/)
      .filter(w => w.length > 1 && !STOP.has(w) && !/^\d+$/.test(w)).map(stem);
  }
  function features(text) {            // unigrams + bigrams
    const t = tokens(text), out = t.slice();
    for (let i = 0; i < t.length - 1; i++) out.push(t[i] + ' ' + t[i + 1]);
    return out;
  }
  function topKeywords(text, n) {
    const tf = new Map();
    tokens(text).filter(w => w.length > 3).forEach(w => tf.set(w, (tf.get(w) || 0) + 1));
    return [...tf.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, n || 10).map(e => e[0]);
  }

  function makeIdf(docs) {
    const df = new Map();
    docs.forEach(d => new Set(d).forEach(w => df.set(w, (df.get(w) || 0) + 1)));
    return { N: docs.length, df };
  }
  function vec(feats, corpus) {
    const tf = new Map();
    feats.forEach(t => tf.set(t, (tf.get(t) || 0) + 1));
    const v = new Map(); let sq = 0;
    tf.forEach((n, w) => {
      const idf = Math.log((corpus.N + 1) / ((corpus.df.get(w) || 0) + 1)) + 1;
      const x = (1 + Math.log(n)) * idf; v.set(w, x); sq += x * x;
    });
    return { v, norm: Math.sqrt(sq) };
  }
  function cosine(a, b) {
    if (!a.norm || !b.norm) return 0;
    const [s, l] = a.v.size < b.v.size ? [a, b] : [b, a];
    let dot = 0; s.v.forEach((x, w) => { const y = l.v.get(w); if (y) dot += x * y; });
    return dot / (a.norm * b.norm);
  }

  g.IMText = { canon, key, uniq, extractSkills, extractDomains, tokens, features, topKeywords, makeIdf, vec, cosine, DOMAINS };
})(typeof window !== 'undefined' ? window : globalThis);


/* ---- resumeParser ---- */
/* resumeParser — turns resume text into structured data.
   parse(text) is a heuristic, rule-based parser that works on plain text with section headings.
   extractText(file) is the integration point for PDF/DOC/DOCX: plug in pdf.js / mammoth in the
   browser, or a server-side extractor, and feed the result to parse(). */
(function (g) {
  'use strict';
  const T = g.IMText;
  const HEAD = /^\s*(skills|technical skills|projects|academic projects|experience|work experience|internships|education|certifications?|achievements)\s*:?\s*$/i;

  function sections(text) {
    const out = {}; let cur = 'header';
    String(text || '').split(/\r?\n/).forEach(line => {
      const m = line.match(HEAD);
      if (m) { cur = m[1].toLowerCase().replace(/^(technical|academic|work)\s+/, '').replace(/s$/, ''); out[cur] = out[cur] || []; return; }
      (out[cur] = out[cur] || []).push(line);
    });
    return out;
  }
  const blocks = lines => (lines || []).join('\n').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const bullets = lines => (lines || []).map(l => l.replace(/^[\s\-•*]+/, '').trim()).filter(Boolean);

  function parse(text) {
    const s = sections(text);
    const cgpa = String(text).match(/cgpa\s*[:\-]?\s*([0-9](?:\.[0-9]{1,2})?)/i);
    const degree = String(text).match(/\b(b\.?\s?tech|b\.?\s?e\.?|m\.?\s?tech|b\.?\s?sc|m\.?\s?sc|bba|mba)\b/i);
    const listed = bullets(s.skill).join(',').split(/[,;|]/).map(x => x.trim()).filter(Boolean).map(T.canon);
    return {
      skills: T.uniq([...listed, ...T.extractSkills(text)]),
      education: { degree: degree ? degree[1] : null, cgpa: cgpa ? parseFloat(cgpa[1]) : null, lines: bullets(s.education) },
      projects: blocks(s.project),
      experience: blocks((s.experience || []).concat(s.internship || [])),
      certifications: bullets(s.certification),
      technologies: T.extractSkills(text),
      keywords: T.topKeywords(text, 15)
    };
  }

  function extractText() {
    return Promise.reject(new Error('resumeParser.extractText is not wired up yet: connect pdf.js / mammoth (browser) or a server-side extractor.'));
  }

  g.IMResumeParser = { parse, extractText };
})(typeof window !== 'undefined' ? window : globalThis);


/* ---- jobDescriptionParser ---- */
/* jobDescriptionParser — normalises a job record into the shape the matchingEngine consumes,
   and suggests skills from free-text descriptions. Swap in an LLM extractor later by
   keeping the same return shape. */
(function (g) {
  'use strict';
  const T = g.IMText;
  const list = a => T.uniq((a || []).map(T.canon).filter(Boolean));

  function parse(job) {
    const required = list(job.required);
    const preferred = list(job.preferred).filter(s => !required.includes(s));
    const text = [job.title, job.description, job.responsibilities, job.qualifications, required.join(', '), preferred.join(', ')]
      .filter(Boolean).join('\n');
    return {
      required, preferred,
      eduDegrees: job.eduDegrees || [], eduBranches: job.eduBranches || [],
      minCgpa: +job.minCgpa || 0, minExperienceMonths: +job.minExperienceMonths || 0,
      text, keywords: T.topKeywords(text, 12), domains: T.extractDomains(text)
    };
  }
  const suggestSkills = text => T.extractSkills(text);

  g.IMJobParser = { parse, suggestSkills };
})(typeof window !== 'undefined' ? window : globalThis);


/* ---- matchingEngine ---- */
/* matchingEngine — INTERNAL recruiter screening score. Never send output to applicant clients.

   MVP implementation ("lexical-tfidf"): deterministic and explainable. Every number is computed from
   the resume and the job; nothing is hard-coded. To move to embeddings / a vector DB / an LLM, keep the
   calculateMatch(resumeData, jobData) contract and replace the internals (see `similarity()` first).

   resumeData: { skills[], projects[{title,desc,tech[]}], experience[{role,org,months,desc}],
                 certifications[], education{degree,branch,cgpa}, text? }
   jobData:    { required[], preferred[], eduDegrees[], eduBranches[], minCgpa, minExperienceMonths,
                 title, description, responsibilities, qualifications }                                  */
(function (g) {
  'use strict';
  const T = g.IMText, P = g.IMJobParser;
  const ENGINE = { name: 'lexical-tfidf', version: '1.0.0' };
  const WEIGHTS = { skill: 0.30, project: 0.20, experience: 0.15, education: 0.10, semantic: 0.20, preferred: 0.05 };
  const REF_COSINE = 0.22;   // cosine at/above which text similarity counts as 100% (calibration constant)
  let corpus = null;

  const sum = a => a.reduce((x, y) => x + y, 0);
  const pct = x => Math.round(x * 100);
  const setCorpus = texts => { corpus = T.makeIdf(texts.map(t => T.features(t))); };

  // Replace this function to move to embeddings; return 0..1.
  function similarity(a, b) {
    const c = corpus || T.makeIdf([T.features(a), T.features(b)]);
    return Math.min(1, T.cosine(T.vec(T.features(a), c), T.vec(T.features(b), c)) / REF_COSINE);
  }

  const BRANCH_GROUPS = [
    ['computer science', 'cse', 'information technology', 'computer engineering', 'software engineering', 'data science', 'artificial intelligence'],
    ['electronics', 'ece', 'electrical', 'eee', 'instrumentation', 'electronics and communication'],
    ['mechanical', 'mechatronics', 'robotics', 'automation', 'production', 'industrial', 'manufacturing', 'aerospace'],
    ['mathematics', 'statistics', 'economics', 'commerce', 'business', 'management', 'bba', 'mba']
  ];
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  const groupOf = b => BRANCH_GROUPS.findIndex(gr => gr.some(t => b === t || (t.length > 3 && b.includes(t))));

  function normResume(r) {
    const skills = T.uniq((r.skills || []).map(T.canon));
    const projects = (r.projects || []).map(p => {
      const text = [p.title, p.desc, (p.tech || []).join(' ')].join('. ');
      return { title: p.title, text, skills: new Set([...(p.tech || []), ...T.extractSkills(text)].map(T.key)) };
    });
    const experience = (r.experience || []).map(e => {
      const text = [e.role, e.org, e.desc].join('. ');
      return { role: e.role, org: e.org, months: +e.months || 0, text, skills: new Set(T.extractSkills(text).map(T.key)) };
    });
    const certs = (r.certifications || []).map(c => ({ name: c, skills: new Set(T.extractSkills(c).map(T.key)) }));
    const text = r.text || [skills.join(', '), ...projects.map(p => p.text), ...experience.map(e => e.text), ...(r.certifications || [])].join('\n');
    return { skills, skillKeys: new Set(skills.map(T.key)), textKeys: new Set(T.extractSkills(text).map(T.key)), projects, experience, certs, education: r.education || {}, text };
  }

  // Claimed vs demonstrated: a skill only listed counts less than one shown in a project or role.
  function coverage(list, R) {
    return list.map(s => {
      const k = T.key(s), ev = [];
      R.projects.forEach(p => { if (p.skills.has(k)) ev.push('project: ' + p.title); });
      R.experience.forEach(e => { if (e.skills.has(k)) ev.push('experience: ' + e.role + ', ' + e.org); });
      const cert = R.certs.find(c => c.skills.has(k));
      let w = 0;
      if (ev.length) w = 1;
      else if (cert) { w = 0.9; ev.push('certification: ' + cert.name); }
      else if (R.skillKeys.has(k)) { w = 0.8; ev.push('skills list'); }
      else if (R.textKeys.has(k)) { w = 0.6; ev.push('resume text'); }
      return { skill: s, weight: w, evidence: ev, demonstrated: w >= 0.9, found: w > 0 };
    });
  }

  function calculateMatch(resumeData, jobData) {
    const R = normResume(resumeData), J = P.parse(jobData);
    const req = coverage(J.required, R), pref = coverage(J.preferred, R);

/* ---- recommendationEngine ---- */
/* recommendationEngine — APPLICANT-FACING. Separate from the recruiter screening score on purpose.
   Uses only what the applicant sees about themselves (skills, preferred domains, location/mode) and
   returns qualitative labels, never numbers. The applicant dashboard can call:

(function (g) {
  'use strict';
  const T = g.IMText, P = g.IMJobParser;

  function recommend(applicant, jobs, opts) {
    const mine = new Set((applicant.skills || []).map(T.key));
    const doms = new Set(applicant.domains || []);
    const ranked = jobs.map(j => {
      const J = P.parse(j), all = T.uniq([...J.required, ...J.preferred]);
      const overlap = all.filter(s => mine.has(T.key(s)));
      const cov = all.length ? overlap.length / all.length : 0;
      const domHit = J.domains.filter(d => doms.has(d));
      const dom = doms.size ? Math.min(1, domHit.length) : 0;
      const loc = applicant.location && j.location && applicant.location === j.location ? 1 : (j.mode === 'Remote' ? 0.7 : 0);
      const score = 0.6 * cov + 0.25 * dom + 0.15 * loc;          // internal ordering only, never returned
      const reasons = [];
      if (overlap.length) reasons.push('Uses skills on your profile: ' + overlap.slice(0, 4).join(', '));
      if (domHit.length) reasons.push('Matches your interest in ' + domHit.join(', '));
      if (loc === 1) reasons.push('In your preferred location');
      return { jobId: j.id, score, label: score >= 0.5 ? 'Strong Match' : score >= 0.28 ? 'Relevant' : 'Explore', reasons };
    }).sort((a, b) => b.score - a.score);
    return ranked.slice(0, (opts && opts.limit) || 5).map(({ jobId, label, reasons }) => ({ jobId, label, reasons }));

  /* ---------- analytics ---------- */
  V.analytics = function () {
    if (!DB.can('analytics.view')) return noAccess();
    const u = me(), jobsL = DB.jobsFor(u), scope = ST.anJob === 'all' ? jobsL : jobsL.filter(j => j.id === ST.anJob), ids = new Set(scope.map(j => j.id));
    const apps = DB.appsFor(u).filter(a => ids.has(a.jobId)), n = apps.length;
    const ever = (a, arr) => DB.historyOf(a.id).some(e => e.action === 'STATUS_CHANGED' && arr.includes(e.meta.to));
    const interviewed = apps.filter(a => DB.historyOf(a.id).some(e => e.action === 'STATUS_CHANGED' && e.meta.to === 'IN_ROUND' && isInterviewRound(DB.get('rounds', e.meta.roundId))) || DB.all('interviews').some(i => i.applicationId === a.id)).length;
    const shortlisted = apps.filter(a => ever(a, ['SHORTLISTED', 'IN_ROUND', 'SELECTED'])).length, screened = apps.filter(a => a.status !== 'APPLIED').length, selected = apps.filter(a => a.status === 'SELECTED').length;
    const matches = apps.map(a => DB.matchOf(a.id)).filter(Boolean), avg = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : 0;
    const pct = (a, b) => b ? (a / b * 100).toFixed(0) + '%' : '—';
    const byRound = {}; apps.filter(a => a.status === 'IN_ROUND').forEach(a => { const nm = roundName(a.roundId); byRound[nm] = (byRound[nm] || 0) + 1; });
    const order = ST.anJob === 'all' ? Object.keys(byRound) : DB.roundsOf(ST.anJob).map(r => r.name);
    const day = 864e5, pts = []; for (let i = 29; i >= 0; i--) { const d0 = new Date(Date.now() - i * day), k = d0.toDateString(); pts.push({ x: fmtShort(d0), y: apps.filter(a => new Date(a.appliedAt).toDateString() === k).length }); }
    const sk = {}; apps.forEach(a => DB.get('applicants', a.applicantId).skills.forEach(s => { const c = T.canon(s); sk[c] = (sk[c] || 0) + 1; }));
    const topSk = Object.entries(sk).sort((a, b) => b[1] - a[1]).slice(0, 10).map(x => ({ label: x[0], value: x[1] }));
    const kpi = [['Applications', n], ['Average match', matches.length ? avg(matches.map(m => m.overallScore)).toFixed(1) : '—'], ['Shortlist rate', pct(shortlisted, n)], ['Selection rate', pct(selected, n)]];

        <section class="panel"><div class="pt"><h2>Applications over time</h2><small class="muted">Last 30 days</small></div>${U.line(pts)}</section>
        <section class="panel"><div class="pt"><h2>Skill distribution</h2><small class="muted">Most common skills among applicants</small></div>${U.hbar(topSk)}</section></div>
        <div class="col"><section class="panel"><div class="pt"><h2>Applications per internship</h2></div>${U.hbar(scope.map(j => ({ label: j.title, value: apps.filter(a => a.jobId === j.id).length })))}</section>

  /* ---------- settings ---------- */
  function evText(e) {
    const m = e.meta || {};
    switch (e.action) {
      case 'STATUS_CHANGED': {
        const to = m.to, r = roundName(m.roundId);
        if (to === 'IN_ROUND') return 'Moved to ' + r;
        if (to === 'REJECTED') return m.reason === 'POSITION_FILLED' ? 'Closed: position filled' : 'Rejected' + (r ? ' after ' + r : '');
        if (to === 'WAITLISTED') return 'Waitlisted' + (r ? ' after ' + r : '');
        if (to === 'SELECTED') return 'Selected';
        return U.STATUS[to] ? U.STATUS[to][0] : String(to);
      }
      case 'APPLICATION_SUBMITTED': return 'Application submitted';
      case 'INTERVIEW_SCHEDULED': return 'Interview scheduled';
      case 'NOTE_ADDED': return 'Private note added';
      case 'FEEDBACK_ADDED': return 'Interview feedback added';
      case 'JOB_CREATED': return 'Internship created: ' + (m.title || '');
      case 'JOB_UPDATED': return 'Internship edited (matches recomputed)';
      case 'JOB_CLOSED': return m.filled ? 'Internship closed as filled' : 'Internship closed';
      case 'ROUND_CREATED': return 'Round added: ' + m.round; case 'ROUND_UPDATED': return 'Round edited: ' + m.round; case 'ROUND_DELETED': return 'Round removed: ' + m.round;

      const res = DB.deleteRound(d.id, me().id); if (res.error) return U.toast(res.error, 'err'); render(); U.toast('Round deleted.', 'ok');
    },
    addRound(d) { const n = val('newRound'); if (!n) return U.toast('Give the round a name.', 'err'); DB.addRound(d.id, { name: n }, me().id); render(); U.toast('Round added.', 'ok'); },
    anJob(d) { ST.anJob = d.value; render(); },
    setTab(d) { ST.setTab = d.id; render(); },
    setRole(d) { DB.setMemberRole(d.id, d.value, me().id); render(); U.toast('Role updated.', 'ok'); },
    newJob() { U.openModal(V.jobModal(null), true); },
    editJob(d) { U.openModal(V.jobModal(DB.get('jobs', d.id)), true); },
    suggestSkills() {
      const found = g.IMJobParser.suggestSkills([val('jf-description'), val('jf-responsibilities'), val('jf-qualifications')].join(' '));
      $('sugg').textContent = found.length ? 'Mentioned in the text: ' + found.join(', ') : 'No known skills found in the text yet.';
      if (found.length && !val('jf-required')) $('jf-required').value = found.join(', ');
    },
    saveJob(d) {
      const j = readJob(), errs = [];
      if (!j.title) errs.push('a title'); if (!j.deadline) errs.push('an application deadline'); if (j.openings < 1) errs.push('at least 1 opening'); if (!j.required.length) errs.push('at least one required skill'); if (!j.description) errs.push('a description');
      if (errs.length) return U.toast('Add ' + errs.join(', ') + '.', 'err');
      if (d.id) { DB.updateJob(d.id, j, me().id); U.closeModal(); render(); U.toast('Saved. Matches recomputed for every applicant.', 'ok'); }
      else { const job = DB.createJob({ ...j, companyId: me().companyId }, me().id); U.closeModal(); location.hash = '#/jobs/' + job.id; U.toast(`Created ${job.id}. Applicants can now apply.`, 'ok'); }
    },
    closeJob(d) { U.openModal(V.closeJobModal(d.id)); },
    confirmClose(d) { const n = DB.closeJob(d.id, { filled: $('cjFilled').checked, actor: me().id }); U.closeModal(); render(); U.toast(n ? `Position closed. ${n} applicants notified.` : 'Position closed.', 'ok'); },
    scheduleModal(d) { U.openModal(V.scheduleModal(d.id)); },
    saveInterview(d) {
      const at = val('iv-at'); if (!at) return U.toast('Choose a date and time.', 'err');
      DB.scheduleInterview({ applicationId: d.id, at: new Date(at).toISOString(), mode: val('iv-mode'), location: val('iv-loc'), interviewerIds: [...document.querySelectorAll('[data-iv]:checked')].map(x => x.dataset.iv) }, me().id);
      U.closeModal(); render(); U.toast('Interview scheduled. Applicant notified.', 'ok');
    },
    memberModal() { U.openModal(V.memberModal()); },
    saveMember() { const n = val('mb-name'), e = val('mb-email'); if (!n || !/^\S+@\S+\.\S+$/.test(e)) return U.toast('Enter a name and a valid email.', 'err'); DB.addMember({ name: n, email: e, companyRole: val('mb-role') }, me().id); U.closeModal(); render(); U.toast('Team member added.', 'ok'); },
    addNote(d) { const t = val('noteText'); if (!t) return U.toast('Write a note first.', 'err'); DB.addNote(d.id, t, me().id); render(); U.toast('Private note added.', 'ok'); },
    addFeedback(d) {
      const t = val('fbText'); if (!t) return U.toast('Add a few words of feedback.', 'err');
      const a = DB.get('applications', d.id); DB.addFeedback({ applicationId: d.id, roundId: a.roundId, rating: +val('fbRating'), recommendation: val('fbRec'), comments: t }, me().id); render(); U.toast('Feedback saved.', 'ok');
    },
    dlResume(d) {
      const a = DB.get('applications', d.id), ap = DB.get('applicants', a.applicantId), blob = new Blob([ap.resume.text], { type: 'text/plain' }), url = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = url; l.download = ap.resume.fileName.replace(/\.pdf$/i, '') + '.txt'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 500);
      DB.addAudit('RESUME_DOWNLOADED', 'application', d.id, {}, me().id); DB.save();
    },
    recompute(d) { DB.computeMatch(d.id); render(); U.toast('Match recomputed.', 'ok'); },
    recomputeAll() { DB.recomputeAll(); render(); U.toast('All match scores recomputed.', 'ok'); },
    async resetDemo() { const ok = await U.confirmDialog({ title: 'Reset demo data?', body: 'This replaces everything in this browser with the original demo data and signs you out.', confirm: 'Reset', danger: true }); if (!ok) return; DB.reset(); ST.sel.clear(); ST.drawer = null; location.hash = '#/dashboard'; render(); },
    simulateApp() {
      const u = me(), jobsL = DB.jobsFor(u).filter(j => j.status === 'ACTIVE'), aps = DB.all('applicants').slice().sort(() => Math.random() - 0.5);
      for (const ap of aps) for (const j of jobsL) if (!DB.all('applications').some(a => a.applicantId === ap.id && a.jobId === j.id)) {
        const r = DB.submitApplication(ap.id, j.id); if (r.error) continue; render(); return U.toast(`${ap.name} applied to ${j.title}. Match computed, applicant notified.`, 'ok');
      }
      U.toast('Every applicant has already applied to every active internship.', 'err');
    },
    closeModal() { U.closeModal(); },
    confirmYes() { U.resolveConfirm(true); U.closeModal(); },
    confirmNo() { U.resolveConfirm(false); U.closeModal(); }
  };

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const gs = e.target.closest('.gs'); const sres = $('sres'); if (!gs && sres) sres.hidden = true;
    const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || el.tagName === 'OPTION') return;
    if (el.tagName === 'INPUT' && el.type !== 'checkbox') return;
    const fn = A[el.dataset.act]; if (fn) fn(el.dataset, el, e);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.tagName === 'SELECT' && el.dataset.act && A[el.dataset.act]) return A[el.dataset.act]({ ...el.dataset, value: el.value }, el, e);
    if (el.dataset.rf) {
      const v = el.dataset.rf === 'date' ? (el.value ? new Date(el.value + 'T09:00:00').toISOString() : null) : el.value.trim();
      if (el.dataset.rf === 'name' && !v) { U.toast('A round needs a name.', 'err'); return render(); }
      DB.updateRound(el.dataset.id, { [el.dataset.rf]: v }, me().id); U.toast('Round saved.', 'ok');
    }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.flt) { const f = V.getFlt(el.dataset.scope); f[el.dataset.flt] = el.value; ST.sel.clear(); return render(); }
    if (el.id === 'gsearch') { const box = $('sres'), h = V.searchResults(el.value); box.innerHTML = h; box.hidden = !h; }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ST.drawer && !$('modal').open) A.closeDrawer(); });
  window.addEventListener('hashchange', () => { ST.sel.clear(); ST.drawer = null; ST.navOpen = false; render(); window.scrollTo(0, 0); });

  document.addEventListener('DOMContentLoaded', () => {
    $('modal').addEventListener('close', () => U.resolveConfirm(false));
    DB.init(); render();
  });
})(window);

  </script>
</body>
</html>
